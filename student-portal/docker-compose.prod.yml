version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: student_portal_db_prod
    environment:
      POSTGRES_DB: student_portal
      POSTGRES_USER: ${DB_USER:-student_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - student_portal_prod
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-student_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student_portal_backend_prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-student_user}:${DB_PASSWORD:-change_me}@postgres:5432/student_portal
      JWT_SECRET: ${JWT_SECRET:-change_this_strong_secret}
      JWT_EXPIRE: 7d
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - student_portal_prod
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student_portal_frontend_prod
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:5000/api}
    depends_on:
      - backend
    networks:
      - student_portal_prod
    restart: always

volumes:
  postgres_data_prod:

networks:
  student_portal_prod:
    driver: bridge
